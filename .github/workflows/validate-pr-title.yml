name: Validate release PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ PR title must contain a version like 'v1.2.3'"
            echo "   Current title: $TITLE"
            echo "   Examples:"
            echo "     - 'Release v1.2.3'"
            echo "     - 'v1.2.3 - add new feature'"
            exit 1
          fi
          echo "✅ PR title contains valid version"